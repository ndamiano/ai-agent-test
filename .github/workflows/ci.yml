name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist httpx
      - name: Install playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Bootstrap settings
        run: cp src/config/settings.example.json src/config/settings.json
      - name: Run tests
        run: cd src && python -m pytest ../tests/ -q -n auto
      - name: Unused imports and names
        run: pip install ruff && ruff check src scripts run.py --select F401,F811,F841

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npx eslint .
      - name: Typecheck
        run: cd frontend && npx tsc -b --noEmit
      - name: Test
        run: cd frontend && npm test -- --run
      - name: Build
        run: cd frontend && npm run build
