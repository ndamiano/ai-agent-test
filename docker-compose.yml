services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: maestro:latest
    env_file: .env
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped

    volumes:
      # Durable state (runs/ + private/auth.db + private/platform.db). Named volume => survives
      # image rebuilds. THIS is the critical invariant: losing it wipes accounts + games.
      - maestro-data:/data
      # Staged playable bundles (runtime/games/<id>, served at /play) — also rebuild-durable.
      - maestro-games:/app/runtime/games

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  maestro-data:
  maestro-games:
