<!doctype html>
<!-- The pipeline's own view of a world: loads world.json through the same loader a
     game does, and hands back one PNG per camera. Opened headless over http by
     terrain/render.py; nothing about a particular world is written here. -->
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style></head>
<body>
<script type="module">
import * as THREE from './three.module.js';
import { loadWorld } from './world.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
// Shadows, tone mapping and the output colour space are the loader's to set for
// a world, so that the frames the refinement loop judges are lit the same way
// the game a player opens is.
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Straight down is where look_at cannot build a basis from UP, so the up axis
// falls back the way the camera model this pipeline casts rays with does.
function aim(camera, from, at) {
  camera.position.set(from[0], from[1], from[2]);
  const target = new THREE.Vector3(at[0], at[1], at[2]);
  const direction = target.clone().sub(camera.position).normalize();
  camera.up.set(0, 1, 0);
  if (Math.abs(direction.y) > 0.999) camera.up.set(0, 0, -1);
  camera.lookAt(target);
}

function shoot(scene, camera, width, height) {
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
}

async function world(url, width, height) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfd4e6);
  const built = await loadWorld(url, { renderer, scene });
  scene.add(built.group);
  const shots = [];
  for (const shot of built.job.cameras) {
    const camera = new THREE.PerspectiveCamera(
      shot.fov || 55.0, width / height, Math.max(built.job.size_m * 0.001, 0.1),
      built.job.size_m * 4.0,
    );
    aim(camera, shot.position, shot.look_at);
    shots.push({ name: shot.name, png: shoot(scene, camera, width, height) });
  }
  return shots;
}

window.renderWorld = world;
window.rendererReady = true;
</script>
</body>
</html>
