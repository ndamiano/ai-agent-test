services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: maestro:latest
    env_file: .env
    environment:
      MAESTRO_DATA_DIR: /data
    ports:
      # Loopback only: everything that reaches the app goes through a local proxy (Caddy on
      # 80/443, Tailscale Funnel) — a 0.0.0.0 bind bypasses ufw via Docker's own iptables chain
      # and serves the app to the whole internet on :8000.
      - "127.0.0.1:${PORT:-8000}:8000"
    restart: unless-stopped

    volumes:
      # Durable state (runs/ + auth.db + platform.db). Named volume => survives
      # image rebuilds. THIS is the critical invariant: losing it wipes accounts + games.
      - maestro-data:/data
      # Staged playable bundles (runtime/games/<id>, served at /play) — also rebuild-durable.
      - maestro-games:/app/runtime/games
      # Demo snapshots (runtime/demos/<id>, served at /play/demos) — copied once by
      # `python -m maestro.demos snapshot`, untouched by any later build of the same run.
      - maestro-demos:/app/runtime/demos
      - maestro-shares:/app/runtime/shares
      # settings.json is dockerignored (never baked into the image), so structured config the
      # env can't express (runpod.queues) rides a host bind — create the file before first up.
      - ./src/config/settings.json:/app/src/config/settings.json

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  maestro-data:
  maestro-games:
  maestro-demos:
  maestro-shares:
