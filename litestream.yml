# Litestream replication config for the two control-plane databases (docs/backups.md).
# Mounted read-only into the `litestream` compose service. Credentials are NOT here:
# litestream reads LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY from the
# environment, and the bucket/endpoint expand from env below — set all of them in .env.
dbs:
  - path: /data/platform.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_S3_BUCKET}
        path: litestream/platform
        endpoint: ${LITESTREAM_S3_ENDPOINT}
        region: ${LITESTREAM_S3_REGION}
        force-path-style: true
  - path: /data/auth.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_S3_BUCKET}
        path: litestream/auth
        endpoint: ${LITESTREAM_S3_ENDPOINT}
        region: ${LITESTREAM_S3_REGION}
        force-path-style: true
