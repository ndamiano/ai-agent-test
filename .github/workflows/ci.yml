name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The gates shell out to tsc/esbuild, and runtime/node_modules is gitignored — without this
      # every typecheck/headless/render test fails on a fresh checkout.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'runtime/package-lock.json'
      - name: Install runtime toolchain
        run: cd runtime && npm ci
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Bootstrap settings
        run: cp src/config/settings.example.json src/config/settings.json
      - name: Run tests
        run: cd src && python -m pytest ../tests/ --ignore=../tests/integration -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build
