<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Maestro Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">
    <div id="stage">
      <div id="scene"></div>
      <div id="sprites"></div>
      <div id="inventory"></div>
      <div id="hotspots"></div>
      <div id="dialogue" class="hidden">
        <div id="speaker"></div>
        <div id="text"></div>
        <div id="advance">▼</div>
      </div>
      <div id="menu" class="hidden"></div>
      <div id="ending" class="hidden"></div>
    </div>
  </div>
  <script src="engine.js"></script>
</body>
</html>
